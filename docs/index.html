<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="汉语字典词典在线版，支持拼音、字词和页码检索中华经典词典扫描页。">
    <meta name="keywords" content="汉语词典, 词典, 字词检索">
    <meta name="author" content="zispace">
    <meta name="robots" content="index, follow">

    <title>汉语字典词典在线版</title>
    <link rel="icon" href="favicon.ico">
    <link rel="manifest" href="manifest.json">
    <!-- <link rel="preconnect" href="https://raw.githubusercontent.com"> -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/icons.css">
</head>

<body>

    <header>
        <!-- <h1>词典在线</h1> -->
        <div class="search-container">
            <!-- 下拉选择词典 -->
            <div class="dictionary-selector">
                <div class="dict-selector-container">
                    <img id="dictLogo" src="images/logos/logo2.png" alt="Dictionary Logo" class="dict-logo">
                    <select id="dictSelector" class="dict-selector" title="选择词典">
                        <!-- Will be populated by JavaScript -->
                    </select>
                </div>
            </div>
            <div class="search-input-container">
                <input type="text" class="search-input" id="searchInput" placeholder="请输入拼音、字词或正文页码……"
                    autocomplete="off" />
                <div class="search-suggestions" id="searchSuggestions"></div>
            </div>

            <div class="search-buttons">

                <div class="settings-wrapper">
                    <button class="action-btn" id="settingsToggle" title="资源设置" aria-expanded="false"
                        aria-controls="settingsPanel">
                        <span class="settings-icon icon icon-settings" aria-hidden="true"></span>
                    </button>
                    <div class="settings-panel" id="settingsPanel">
                        <label class="settings-field" for="fontSelector">
                            <span>字体样式</span>
                            <select id="fontSelector" class="settings-select"></select>
                        </label>
                        <label class="settings-field" for="proxySelector">
                            <span>数据来源</span>
                            <select id="proxySelector" class="settings-select"></select>
                        </label>
                        <label class="settings-field" for="darkModeSelect">
                            <span>配色模式</span>
                            <select id="darkModeSelect" class="settings-select">
                                <option value="auto">自动</option>
                                <option value="light">亮色</option>
                                <option value="dark">深色</option>
                            </select>
                        </label>
                        <label class="settings-field" for="spreadMode">
                            <span>双面视图</span>
                            <select id="spreadMode" class="settings-select">
                                <option value="0">关闭</option>
                                <option value="1">开启</option>
                            </select>
                        </label>
                    </div>
                </div>

                <button class="action-btn" id="fullscreenBtn" title="全屏模式">
                    <span class="icon icon-fullscreen"></span>
                </button>

                <button class="action-btn" id="tipToggle" title="拼音提示">
                    <span class="icon icon-info"></span>
                </button>

                <button class="action-btn" id="sidebarToggle" title="词典目录">
                    <span class="icon icon-list"></span>
                </button>

                <button class="search-btn" id="searchBtn" title="搜索">
                    <!-- <i class="fas fa-search"></i> -->
                    <span class="icon icon-search"></span>
                </button>
            </div>
        </div>

        <div id="searchResult"></div>
    </header>

    <!-- 拼音声调弹窗 -->
    <div class="popup-overlay" id="pinyinPopup">
        <div class="popup-content">
            <div class="popup-header">
                <h3>提示</h3>
                <button class="close-popup" id="closePopup">&times;</button>
            </div>
            <div class="search-tip">
                <h4>拼音声调速查</h4>
                <ul>
                    <li>āáǎà ōóǒò ēéěè</li>
                    <li>īíǐì ūúǔù üǖǘǚǜ</li>
                    <li>êê̄ếê̌ề m̄ḿm̀ ńňǹ</li>
                    <li>ẑĉŝ ŋ</li>
                </ul>
                <h4>上下页切换</h4>
                <ul>
                    <li>键盘左右方向键</li>
                    <li>点击页面两侧箭头区</li>
                </ul>
            </div>
        </div>
    </div>

    <div class="sidebar" id="sidebarPopup">
        <div class="sidebar-header">
            <h3 id="tocTitle">词典简明目录</h3>
            <button class="close-popup" id="closeSidebarPopup">&times;</button>
        </div>
        <div class="sidebar-content" id="bookmarksList"></div>
    </div>

    <section class="result-container">
        <img id="mainImage" alt="Image" src="images/0001.png" style="opacity: 0.3;">
        <img id="mainImage2" alt="Image" class="spread-image" src="" style="opacity: 0;">
        <div id="prevBtn" class="nav-arrow">
            <span class="icon icon-arrow-left"></span>
        </div>
        <div id="nextBtn" class="nav-arrow">
            <span class="icon icon-arrow-right"></span>
        </div>
        <div id="pageIndicator" class="page-indicator"></div>
    </section>

    <script src="js/dictkit.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
